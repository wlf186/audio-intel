name: Native Windows smoke

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AUDIO_INTEL_MOCK_MODE: "1"
      AUDIO_INTEL_PORT: "20810"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Native preflight
        shell: cmd
        run: service.cmd doctor

      - name: Install API runtime and build frontend
        shell: cmd
        run: service.cmd setup api

      - name: Verify cross-platform dependency locks
        shell: powershell
        run: |
          & .\.runtime\api\Scripts\python.exe scripts\lock_dependencies.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Backend and frontend checks
        shell: powershell
        run: |
          & .\.runtime\api\Scripts\python.exe -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & corepack.cmd pnpm@10.15.1 --dir frontend typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & corepack.cmd pnpm@10.15.1 --dir frontend build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Dependency audits
        shell: powershell
        run: |
          & corepack.cmd pnpm@10.15.1 --dir frontend audit --audit-level high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.runtime\bin\uv.exe tool run pip-audit -r requirements-lock\windows\api.txt --disable-pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Start and exercise native services
        shell: cmd
        run: |
          service.cmd start all
          service.cmd status
          service.cmd restart all
          service.cmd status
          .runtime\api\Scripts\python.exe scripts\smoke_test.py

      - name: Browser checks
        shell: powershell
        run: |
          & corepack.cmd pnpm@10.15.1 --dir frontend exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & corepack.cmd pnpm@10.15.1 --dir frontend test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stop services
        if: always()
        shell: cmd
        run: service.cmd stop all

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          path: logs/
          if-no-files-found: ignore
